name: {{project_name}}
description: A new Flutter project.
homepage: https://{{organization_name}}.{{domain_name}}
version: 1.0.0+1

environment:
  sdk: ">=3.10.1 <4.0.0"

dependencies: {{#enable_dev_menu}}
  alice: 
  alice_dio: ^1.0.6{{/enable_dev_menu}}
  app_links: ^7.0.0
  collection: ^1.18.0
  copy_with_extension: ^10.0.0 {{#has_authentication}}
  crypto: ^3.0.6 {{/has_authentication}}
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  equatable: ^2.0.5{{#analytics}}
  firebase_analytics: ^12.2.0{{/analytics}}{{#uses_firebase}}
  firebase_core: ^4.6.0{{/uses_firebase}}{{#analytics}}
  firebase_crashlytics: ^5.1.0{{/analytics}}{{#push_notifications}}
  firebase_messaging: ^16.1.3{{/push_notifications}}
  flutter:
    sdk: flutter{{#enable_social_logins}}
  flutter_facebook_auth: ^7.1.6{{/enable_social_logins}}{{#push_notifications}}
  flutter_local_notifications: ^19.5.0{{/push_notifications}}
  flutter_localizations:
    sdk: flutter{{#enable_in_app_notifications}}
  flutter_quill: ^11.5.0{{/enable_in_app_notifications}}
  flutter_rx_bloc: ^7.0.0
  flutter_secure_storage: ^10.0.0{{#enable_social_logins}}
  flutter_svg: ^2.0.10{{/enable_social_logins}}
  go_router: ^17.0.1{{#enable_social_logins}}
  google_sign_in: ^7.2.0{{/enable_social_logins}}
  http: ^1.2.2 # This package is used for the local server (if not used, can be removed)
  intl: ^0.20.2
  jaguar_jwt: ^3.0.0 # This package is used for the local server (if not used, can be removed)
  json_annotation: ^4.9.0
  jwt_decoder: ^2.0.1{{#enable_pin_code}}
  local_session_timeout: ^3.2.0{{/enable_pin_code}}
  provider: ^6.1.2
  retrofit: ^4.9.2
  rx_bloc: ^6.0.0
  rx_bloc_list: ^5.0.0
  rxdart: ^0.28.0
  shared_preferences: ^2.3.2
  shelf: ^1.4.1 # This package is used for the local server (if not used, can be removed)
  shelf_router: ^1.1.4 # This package is used for the local server (if not used, can be removed)
  shelf_static: ^1.1.3 # This package is used for the local server (if not used, can be removed){{#enable_social_logins}}
  sign_in_with_apple: ^7.0.1{{/enable_social_logins}}{{#enable_feature_onboarding}}
  url_launcher: ^6.3.1{{/enable_feature_onboarding}}{{#enable_mfa}}
  uuid: ^4.5.1{{/enable_mfa}}
  widget_toolkit: ^0.2.3 {{#enable_pin_code}}
  widget_toolkit_biometrics: ^0.1.1 {{/enable_pin_code}} {{#has_otp}}
  widget_toolkit_otp: ^0.1.2{{/has_otp}}{{#enable_pin_code}}
  widget_toolkit_pin: ^0.3.3{{/enable_pin_code}}{{#enable_feature_qr_scanner}}
  widget_toolkit_qr: ^0.2.1{{/enable_feature_qr_scanner}}
  

dev_dependencies:
  alchemist: ^0.14.0
  build_runner: ^2.10.4
  # flutter_driver:
  #   sdk: flutter
  clean_coverage: ^0.0.3
  copy_with_extension_gen: ^10.0.0
  flutter_lints: any
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.1.3
  intl_utils: ^2.8.13
  json_serializable: ^6.8.0
  mockito: ^5.4.4 {{#enable_patrol}}
  patrol: ^3.13.0-dev.3 {{/enable_patrol}}
  retrofit_generator: 10.2.1
  rx_bloc_generator: ^9.0.0
  rx_bloc_test: ^5.0.0
  test: any {{#enable_patrol}}


patrol:
  app_name: {{project_name}}
  flavor: development
  android:
    package_name: {{domain_name}}.{{organization_name}}.{{project_name}}
  ios:
    bundle_id: {{domain_name}}.{{organization_name}}.{{project_name}}
    app_name: {{project_name}} {{/enable_patrol}} 

dependency_overrides: {{#enable_dev_menu}}
  alice:
    git:
      url: https://github.com/Prime-Holding/alice.git
      ref: feature/fix-alice
      path: packages/alice 
      {{/enable_dev_menu}}

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora/Sora-Thin.ttf
          weight: 100
        - asset: assets/fonts/Sora/Sora-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Sora/Sora-Light.ttf
          weight: 300
        - asset: assets/fonts/Sora/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora/Sora-ExtraBold.ttf
          weight: 800
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto/Roboto-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto/Roboto-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Roboto/Roboto-Black.ttf
          weight: 900

flutter_intl:
  enabled: true
  output_dir: lib/l10n/generated 
